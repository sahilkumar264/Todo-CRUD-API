<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title"><title id="title">Swagger UI for the authenticated Task API</title><rect width="1100" height="640" fill="#0d1117"/><rect x="28" y="24" width="1044" height="590" rx="12" fill="#161b22" stroke="#30363d"/><text x="58" y="78" fill="#e6edf3" font-family="Arial, sans-serif" font-size="34" font-weight="bold">Task API with Supabase Auth</text><text x="58" y="112" fill="#8b949e" font-family="Arial, sans-serif" font-size="17">Swagger UI - bearer authentication configured</text><rect x="890" y="52" width="145" height="48" rx="5" fill="#49cc90"/><text x="920" y="83" fill="#0d1117" font-family="Arial, sans-serif" font-size="19" font-weight="bold">Authorize</text><g font-family="Arial, sans-serif" font-size="20" fill="#e6edf3"><rect x="58" y="150" width="984" height="54" rx="5" fill="#1f6feb" opacity=".27"/><text x="78" y="185">GET     /tasks                         Get all tasks</text><rect x="58" y="216" width="984" height="54" rx="5" fill="#49cc90" opacity=".28"/><text x="78" y="251">POST    /auth/signup                   Create a Supabase account</text><rect x="58" y="282" width="984" height="54" rx="5" fill="#49cc90" opacity=".28"/><text x="78" y="317">POST    /auth/login                    Log in and receive tokens</text><rect x="58" y="348" width="984" height="54" rx="5" fill="#49cc90" opacity=".28"/><text x="78" y="383">POST    /auth/logout                   Log out</text><text x="985" y="383">LOCK</text><rect x="58" y="414" width="984" height="54" rx="5" fill="#1f6feb" opacity=".27"/><text x="78" y="449">GET     /public/info                   Get public information</text><rect x="58" y="480" width="984" height="54" rx="5" fill="#1f6feb" opacity=".27"/><text x="78" y="515">GET     /protected/profile             Get authenticated user profile</text><text x="985" y="515">LOCK</text><rect x="58" y="546" width="984" height="54" rx="5" fill="#1f6feb" opacity=".27"/><text x="78" y="581">GET     /protected/dashboard           Get authenticated user dashboard</text><text x="985" y="581">LOCK</text></g></svg>
